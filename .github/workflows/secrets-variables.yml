name: Secrets and Environments
on:
    workflow_dispatch:

jobs:
    staging-environment:
        runs-on: ubuntu-24.04
        environment: staging
        env:
            # Repository Level
            REPO_SECRET: ${{ secrets.REPO_SECRET }}
            REPO_VARIABLE: ${{ vars.REPO_VARIABLE }}
            # Environment Level
            ENV_SECRET: ${{ secrets.ENV_SECRET }}
            ENV_VARIABLE: ${{ vars.ENV_VARIABLE }}
        steps:
            - name: Inspect value inside job
              run: |
                echo "REPO_SECRET:  ${REPO_SECRET}"
                echo "REPO_VARIABLE:${REPO_VARIABLE}"
                echo "ENV_SECRET:   ${ENV_SECRET}"
                echo "ENV_VARIABLE: ${ENV_VARIABLE}"

    production-environment:
        runs-on: ubuntu-24.04
        environment: production
        env:
            # Repository Level
            REPO_SECRET: ${{ secrets.REPO_SECRET }}
            REPO_VARIABLE: ${{ vars.REPO_VARIABLE }}
            # Environment Level
            ENV_SECRET: ${{ secrets.ENV_SECRET }}
            ENV_VARIABLE: ${{ vars.ENV_VARIABLE }}
        steps:
            - name: Inspect value inside job
              run: |
                echo "REPO_SECRET:  ${REPO_SECRET}"
                echo "REPO_VARIABLE:${REPO_VARIABLE}"
                echo "ENV_SECRET:   ${ENV_SECRET}"
                echo "ENV_VARIABLE: ${ENV_VARIABLE}"
